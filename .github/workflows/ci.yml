# MIGRATION_PLAN.md step 0.3: fmt, clippy and tests on Linux and Windows,
# on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # eframe (remule-gui) builds against the X11/Wayland/xkb headers.
      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features remule-ec/fake-daemon -- -D warnings
      - name: Test
        run: cargo test --workspace --features remule-ec/fake-daemon
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # MIGRATION_PLAN.md 9.M: a released aMule downloads a file that remule
  # shares, on Fedora.
  #
  # Not Ubuntu's 2.3.3: it can stop reading a peer socket for good. It waits
  # for readability with async_read_some(null_buffers()) on Boost.Asio's
  # edge-triggered epoll, and bytes that land before the wait is re-armed
  # never wake it (fixed upstream in 3.x, amule-org/amule ee5289884). The
  # stall hit a stock-2.3.3 source as often as remule.
  amule-interop:
    strategy:
      fail-fast: false
      matrix:
        # amule: the control, the same aMule as the source instead of remule.
        source: [remule, amule]
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 20
    env:
      AMULE_VERSION: 3.2.0
    steps:
      - name: Install tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc git curl tar gzip python3 gawk tcpdump iproute hostname \
            procps-ng util-linux diffutils findutils sudo
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Upstream's static build: one tarball, any distribution.
      - name: Install aMule
        run: |
          curl -fsSL --retry 3 -o /tmp/amule.tar.gz \
            "https://github.com/amule-org/amule/releases/download/$AMULE_VERSION/aMule-$AMULE_VERSION-Linux-x64-static.tar.gz"
          mkdir -p /opt/amule
          tar xzf /tmp/amule.tar.gz -C /opt/amule --strip-components=1
          echo /opt/amule >> "$GITHUB_PATH"
      - name: Build remule
        run: cargo build --release -p remule-cli
      - name: aMule downloads from remule
        run: bash scripts/interop/amule-downloads-from-remule.sh
        env:
          SOURCE: ${{ matrix.source }}

  # MIGRATION_PLAN.md 11.M: the unmodified C++ amulecmd and amulegui drive
  # remuled. No release has the SRP login yet (it came after 3.2.0), so both
  # are built from the aMule-org commit remule is ported from, and cached.
  amulecmd-interop:
    runs-on: ubuntu-latest
    container: fedora:latest
    timeout-minutes: 45
    env:
      AMULE_REF: 688c51eb77654d1fdc2a2967d1dd530c28b74ca5
    steps:
      - name: Install tools
        run: |
          dnf install -y --setopt=install_weak_deps=False \
            gcc gcc-c++ make cmake git curl tar gzip python3 procps-ng \
            wxGTK-devel cryptopp-devel boost-devel zlib-devel readline-devel             glib2-devel libpng-devel xorg-x11-server-Xvfb xorg-x11-xauth             jq iproute
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cache amulecmd, amulegui and amuleapi
        id: amulecmd-cache
        uses: actions/cache@v4
        with:
          path: /opt/amulecmd
          key: amulecmd-amulegui-amuleapi-fedora-${{ env.AMULE_REF }}
      - name: Build amulecmd, amulegui and amuleapi
        if: steps.amulecmd-cache.outputs.cache-hit != 'true'
        run: |
          git init -q /tmp/amule-src
          cd /tmp/amule-src
          git fetch -q --depth 1 https://github.com/amule-org/amule.git "$AMULE_REF"
          git checkout -q FETCH_HEAD
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_MONOLITHIC=NO -DBUILD_ED2K=NO -DBUILD_AMULECMD=YES -DBUILD_REMOTEGUI=YES -DBUILD_AMULEAPI=YES \
            -DENABLE_NLS=NO -DENABLE_UPNP=NO -DENABLE_IP2COUNTRY=NO \
            -DENABLE_MEDIA_PROBE=OFF -DENABLE_VERSION_CHECK=OFF -DENABLE_BFD=NO \
            -DTRANSLATED_MANPAGES=NO
          cmake --build build --target amulecmd amulegui amuleapi -j "$(nproc)"
          mkdir -p /opt/amulecmd
          cp "$(find build -type f -name amulecmd -perm -u+x | head -1)" /opt/amulecmd/
          cp "$(find build -type f -name amulegui -perm -u+x | head -1)" /opt/amulecmd/
          cp "$(find build -type f -name amuleapi -perm -u+x | head -1)" /opt/amulecmd/
          # amuleapi's curl suite and static frontend, where run-all.sh
          # looks for them (it climbs three levels from its own folder).
          mkdir -p /opt/amulecmd/tree/unittests /opt/amulecmd/tree/src/webapi
          cp -R unittests/curl-tests /opt/amulecmd/tree/unittests/
          cp -R src/webapi/static /opt/amulecmd/tree/src/webapi/
      - name: Build remuled
        run: cargo build --release -p remuled
      - name: amulecmd drives remuled
        run: bash scripts/interop/amulecmd-drives-remuled.sh
        env:
          AMULECMD: /opt/amulecmd/amulecmd
      - name: amulegui drives remuled
        run: xvfb-run -a bash scripts/interop/amulegui-drives-remuled.sh
        env:
          AMULECMD: /opt/amulecmd/amulecmd
          AMULEGUI: /opt/amulecmd/amulegui
      # MIGRATION_PLAN.md 12.1: the unmodified amuleapi in front of remuled,
      # tested with aMule's own curl suite.
      - name: amuleapi's curl suite against remuled
        run: bash scripts/interop/amuleapi-on-remuled.sh
        env:
          AMULEAPI: /opt/amulecmd/amuleapi
          SUITE: /opt/amulecmd/tree/unittests/curl-tests/amuleapi
      # MIGRATION_PLAN.md 12.M: aMule's web UI, served by the unmodified
      # amuleapi, driven in Chromium against remuled.
      - name: Install Playwright and Chromium
        run: |
          dnf install -y --setopt=install_weak_deps=False nodejs npm \
            nss atk at-spi2-atk cups-libs libdrm libxkbcommon mesa-libgbm alsa-lib \
            pango libXcomposite libXdamage libXrandr libXfixes
          mkdir -p /opt/pw && cd /opt/pw && npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.63.0
          npx playwright install chromium
      - name: aMule's web UI against remuled
        run: bash scripts/interop/webui-on-remuled.sh
        env:
          NODE_PATH: /opt/pw/node_modules
          AMULEAPI: /opt/amulecmd/amuleapi
          STATIC: /opt/amulecmd/tree/src/webapi/static
