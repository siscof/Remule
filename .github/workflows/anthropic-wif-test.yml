# .github/workflows/anthropic-wif-test.yml
name: anthropic-wif-test
on:
  push:
  # Run it by hand from the Actions tab, or with `gh workflow run anthropic-wif-test`.
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  call-claude:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub OIDC token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);
            // The claims the federation rule is matched against. They are not
            // secret (the signed token above stays masked); printing them shows
            // exactly what the rule has to accept.
            const claims = JSON.parse(Buffer.from(token.split('.')[1], 'base64url').toString());
            const shown = ['iss', 'aud', 'sub', 'repository', 'repository_id', 'repository_owner',
              'repository_owner_id', 'ref', 'ref_type', 'environment', 'event_name',
              'workflow_ref', 'job_workflow_ref', 'repository_visibility'];
            core.info('OIDC token claims:');
            for (const k of shown) {
              if (claims[k] !== undefined) core.info(`  ${k}: ${JSON.stringify(claims[k])}`);
            }
      - name: Exchange for an Anthropic access token
        # An explicit `shell: bash` runs with -o pipefail, so a failed curl
        # fails the step even though its output is piped into jq. Without it
        # (plain `bash -e`) an authentication error still showed as a pass.
        shell: bash
        run: |
          curl -sS --fail-with-body https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" \
            --data @- <<JSON | jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)'
          {
            "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
            "assertion": "$JWT",
            "federation_rule_id": "fdrl_017b24WWVFdHcCFYQmQ2Lmsx",
            "organization_id": "b7563563-015c-44eb-a831-7a964dd9a124",
            "service_account_id": "svac_01CBJCpXMJotmgqdxQ1CkxW1",
            "workspace_id": "wrkspc_01HK8Jy29tGEmxYoaryrGgdi"
          }
          JSON
