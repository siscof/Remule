[package]
name = "remule-ec"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "aMule's External Connection (EC) protocol: codec, SRP login, AEAD transport, client and daemon sides"

[dependencies]
thiserror = "2"
flate2 = "1"
rand = "0.8"
# SRP-6a (EC_SRP.md)
num-bigint = "0.4"
sha2 = "0.10"
hmac = "0.12"
scrypt = { version = "0.11", default-features = false }
md-5 = "0.10"
# AEAD transport (EC_Protocol.md §1.3)
hkdf = "0.12"
x25519-dalek = "2"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
subtle = "2"
zeroize = "1"

[features]
# `remule_ec::fake`: the server half of the login plus a request loop, for
# tests and for `examples/fake_amuled.rs` (GUI work without a daemon).
fake-daemon = []

[[example]]
name = "fake_amuled"
required-features = ["fake-daemon"]
