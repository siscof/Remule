[workspace]
members = [
	'ed2k-codec',
	'ed2k-crypto',
	'ed2k-formats',
	'ed2k-hash',
	'ed2k-kad',
	'ed2k-peer',
	'ed2k-server',
	'ed2k-types',
	'remule-app',
	'remule-cli',
	'remule-core',
	'remule-ec',
	'remule-gui',
	'remule-net',
	'remuled',
	'remulecmd',
]
resolver = "2"

[workspace.package]
license = "GPL-2.0-or-later"

[profile.release]
debug = true

# The EC login runs scrypt (N=2^15) and 3072-bit modexps. Unoptimised, that
# takes many seconds; optimise just those dependencies in dev builds.
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.num-bigint]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.md4]
opt-level = 3
[profile.dev.package.sha1]
opt-level = 3
