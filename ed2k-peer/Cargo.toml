[package]
name = "ed2k-peer"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "eD2k client-to-client protocol: hello handshake, file requests, hash sets, block transfers"

[dependencies]
ed2k-codec = { path = "../ed2k-codec" }
ed2k-crypto = { path = "../ed2k-crypto" }
ed2k-types = { path = "../ed2k-types" }
thiserror = "2"
flate2 = "1"
rsa = "0.9"

[dev-dependencies]
ed2k-formats = { path = "../ed2k-formats" }
ed2k-hash = { path = "../ed2k-hash" }
rand = "0.8"
