# MIGRATION_PLAN.md step 0.3: fmt, clippy and tests on Linux and Windows,
# on every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # eframe (remule-gui) builds against the X11/Wayland/xkb headers.
      - name: Install GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libwayland-dev
      - name: Clippy
        run: cargo clippy --workspace --all-targets --features remule-ec/fake-daemon -- -D warnings
      - name: Test
        run: cargo test --workspace --features remule-ec/fake-daemon
      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # MIGRATION_PLAN.md 9.M: a stock aMule (Ubuntu's package) downloads a
  # file that remule shares.
  amule-interop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install aMule
        run: |
          sudo apt-get update
          sudo apt-get install -y amule-daemon amule-utils tcpdump
      - name: Build remule
        run: cargo build --release -p remule-cli
      - name: aMule downloads from remule
        run: bash scripts/interop/amule-downloads-from-remule.sh
