[package]
name = "remuled"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The remule daemon: the client run from an aMule config directory"

[[bin]]
name = "remuled"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ed2k-codec = { path = "../ed2k-codec" }
ed2k-formats = { path = "../ed2k-formats" }
ed2k-hash = { path = "../ed2k-hash" }
ed2k-crypto = { path = "../ed2k-crypto" }
ed2k-kad = { path = "../ed2k-kad" }
ed2k-peer = { path = "../ed2k-peer" }
ed2k-server = { path = "../ed2k-server" }
ed2k-types = { path = "../ed2k-types" }
rand = "0.8"
remule-core = { path = "../remule-core" }
remule-ec = { path = "../remule-ec" }
remule-net = { path = "../remule-net" }
# server.met and nodes.dat over HTTPS; rustls, so no OpenSSL to link.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tokio = { version = "1", features = ["net", "time", "rt-multi-thread", "macros", "signal", "sync"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
flate2 = "1"

# The free space of the temp and incoming folders, for the statistics.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
