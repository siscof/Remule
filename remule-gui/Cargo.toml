[package]
name = "remule-gui"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Remote GUI for an aMule daemon over EC: a Rust port of amulegui"

[dependencies]
remule-ec = { path = "../remule-ec" }
eframe = { version = "0.29", features = ["persistence"] }
egui_extras = "0.29"
egui_plot = "0.29"
serde = { version = "1", features = ["derive"] }
