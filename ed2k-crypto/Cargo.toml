[package]
name = "ed2k-crypto"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "eMule protocol obfuscation (RC4, TCP and UDP), secure user identification (RSA), credits"

[dependencies]
ed2k-types = { path = "../ed2k-types" }
md-5 = "0.10"
num-bigint = "0.4"
rand = "0.8"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
thiserror = "2"

[dev-dependencies]
ed2k-formats = { path = "../ed2k-formats" }
