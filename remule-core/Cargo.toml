[package]
name = "remule-core"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "remule's client core: part files and the download queue, later the upload queue"

[dependencies]
ed2k-formats = { path = "../ed2k-formats" }
ed2k-codec = { path = "../ed2k-codec" }
ed2k-hash = { path = "../ed2k-hash" }
ed2k-kad = { path = "../ed2k-kad" }
ed2k-peer = { path = "../ed2k-peer" }
ed2k-server = { path = "../ed2k-server" }
ed2k-types = { path = "../ed2k-types" }
md4 = "0.10"
remule-net = { path = "../remule-net" }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"] }
